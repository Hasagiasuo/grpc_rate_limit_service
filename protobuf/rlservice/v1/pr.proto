syntax = "proto3";
package rlservice.v1;
option go_package = "gen/v1;rlservicepb";

service RateLimitService {
    rpc Check(CheckRequest) returns (CheckResponse);
}

message CheckRequest {
    string key = 1;
    string rule = 2;
    string serviceToken = 3;
}

message CheckResponse {
    bool allowed = 1;
    int64 retry_after = 2;
}
